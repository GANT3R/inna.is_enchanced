<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Colors Settings</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; }
    .wrap { max-width: 760px; margin: 32px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .subtitle { margin: 0 0 24px; color: #6b7280; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
    .field { display: grid; gap: 8px; }
    label { font-size: 14px; font-weight: 600; }
    select, input[type="color"] { height: 42px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 12px; background: #fff; font-size: 14px; }
    input[type="range"] { width: 100%; accent-color: #374151; }
    .range-value { font-size: 13px; color: #6b7280; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
    #saveBtn { background: #374151; color: #fff; }
    #resetBtn { background: #e5e7eb; color: #111827; }
    .status { margin-top: 14px; min-height: 20px; font-size: 14px; color: #2563eb; }
    .preview { display: grid; gap: 10px; margin-top: 20px; }
    .preview-row { padding: 12px 14px; border-radius: 8px; border-left: 4px solid transparent; font-size: 14px; }
    #previewPresent { background: rgba(34, 197, 94, 0.18); border-left-color: #22c55e; box-shadow: inset 0 0 0 9999px rgba(34, 197, 94, 0.06); }
    #previewAbsent { background: rgba(239, 68, 68, 0.18); border-left-color: #ef4444; box-shadow: inset 0 0 0 9999px rgba(239, 68, 68, 0.06); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="pageTitle"></h1>
      <p class="subtitle" id="pageSubtitle"></p>
      <div class="grid">
        <div class="field">
          <label for="language" id="languageLabel"></label>
          <select id="language">
            <option value="en">English</option>
            <option value="is">Íslenska</option>
          </select>
        </div>
        <div class="field">
          <label for="theme" id="themeLabel"></label>
          <select id="theme">
            <option value="default" id="themeDefaultOption"></option>
            <option value="new" id="themeNewOption"></option>
          </select>
        </div>
        <div class="field">
          <label for="teacherAbsenceMode" id="teacherAbsenceModeLabel"></label>
          <select id="teacherAbsenceMode">
            <option value="gray" id="teacherAbsenceGrayOption"></option>
            <option value="free" id="teacherAbsenceFreeOption"></option>
          </select>
        </div>
        <div class="field">
          <label for="lunchRowReductionPercent" id="lunchRowReductionLabel"></label>
          <input id="lunchRowReductionPercent" type="range" min="0" max="30" step="1">
          <div class="range-value" id="lunchRowReductionValue"></div>
        </div>
        <div class="field">
          <label for="presentColor" id="presentColorLabel"></label>
          <input id="presentColor" type="color">
        </div>
        <div class="field">
          <label for="absentColor" id="absentColorLabel"></label>
          <input id="absentColor" type="color">
        </div>
      </div>
      <div class="preview">
        <div class="preview-row" id="previewPresent"></div>
        <div class="preview-row" id="previewAbsent"></div>
      </div>
      <div class="actions">
        <button id="saveBtn" type="button"></button>
        <button id="resetBtn" type="button"></button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
